<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji App</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  max-width:420px;
  margin:30px auto;
}

.kanji {
  font-size:80px;
  margin:20px;
}

button {
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  font-size:18px;
}

.correct { background:#22c55e; color:white; }
.wrong { background:#ef4444; color:white; }

.hide { display:none; }
</style>
</head>

<body>

<!-- MENU -->
<div class="card" id="menu">
  <h2>Kanji App</h2>
  <button onclick="startLearn()">📚 Học 50 bộ thủ</button>
  <button onclick="startQuiz()">🎮 Trắc nghiệm</button>
</div>

<!-- HỌC -->
<div class="card hide" id="learn">
  <h2>Học bộ thủ</h2>
  <div class="kanji" id="learnKanji"></div>
  <div id="learnMean"></div>
  <button onclick="nextLearn()">Tiếp</button>
  <button onclick="backMenu()">Quay lại</button>
</div>

<!-- QUIZ -->
<div class="card hide" id="quiz">
  <h2>Kanji Quiz</h2>
  <div class="kanji" id="qKanji"></div>

  <div id="answers"></div>

  <p id="result"></p>
  <p id="score"></p>
</div>

<!-- RESULT -->
<div class="card hide" id="end">
  <h2>Kết thúc</h2>
  <p id="final"></p>
  <button onclick="retryWrong()">Làm lại câu sai</button>
  <button onclick="startQuiz()">Chơi lại</button>
  <button onclick="backMenu()">Menu</button>
</div>

<script>

// ===== DATA 50 BỘ THỦ =====
let fullData = [
["人","người"],["女","phụ nữ"],["子","trẻ con"],["心","tim"],
["手","tay"],["目","mắt"],["口","miệng"],["耳","tai"],
["足","chân"],["水","nước"],["火","lửa"],["木","cây"],
["金","tiền"],["土","đất"],["日","mặt trời"],["月","mặt trăng"],
["言","nói"],["食","ăn"],["車","xe"],["門","cửa"],
["力","sức"],["又","tay / lại"],["生","sống"],["田","ruộng"],
["山","núi"],["川","sông"],["空","trời"],["雨","mưa"],
["石","đá"],["花","hoa"],["草","cỏ"],["虫","côn trùng"],
["犬","chó"],["魚","cá"],["鳥","chim"],["馬","ngựa"],
["牛","bò"],["羊","cừu"],["貝","sò"],["竹","tre"],
["糸","sợi"],["衣","áo"],["見","nhìn"],["走","chạy"],
["立","đứng"],["休","nghỉ"],["入","vào"],["出","ra"],
["上","trên"],["下","dưới"]
];

// ===== ÂM THANH =====
function sound(ok){
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let o = ctx.createOscillator();
  o.type="sine";
  o.frequency.value = ok ? 600 : 200;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

// ===== CHUNG =====
function show(id){
  ["menu","learn","quiz","end"].forEach(x=>{
    document.getElementById(x).classList.add("hide");
  });
  document.getElementById(id).classList.remove("hide");
}

// ===== HỌC =====
let learnIndex=0;

function startLearn(){
  show("learn");
  learnIndex=0;
  nextLearn();
}

function nextLearn(){
  let item = fullData[learnIndex % fullData.length];
  document.getElementById("learnKanji").innerText=item[0];
  document.getElementById("learnMean").innerText=item[1];
  learnIndex++;
}

// ===== QUIZ =====
let data=[], current, score=0, count=0, wrongList=[], lastKanji=null;

function startQuiz(){
  show("quiz");
  data=[...fullData];
  score=0;
  count=0;
  wrongList=[];
  next();
}

function next(){
  if(count>=30){
    endGame();
    return;
  }

  // tránh lặp liên tiếp
  do{
    current = data[Math.floor(Math.random()*data.length)];
  }while(current[0]===lastKanji);

  lastKanji=current[0];

  document.getElementById("qKanji").innerText=current[0];
  document.getElementById("result").innerText="";

  let answers=[current[1]];

  while(answers.length<4){
    let r = fullData[Math.floor(Math.random()*fullData.length)][1];
    if(!answers.includes(r)) answers.push(r);
  }

  answers.sort(()=>Math.random()-0.5);

  let html="";
  answers.forEach(a=>{
    html += `<button onclick="check(this,'${a}')">${a}</button>`;
  });

  document.getElementById("answers").innerHTML=html;
}

// ===== CHECK =====
function check(btn, ans){
  count++;

  if(ans===current[1]){
    score++;
    btn.classList.add("correct");
    document.getElementById("result").innerText="✅ Đúng";
    sound(true);
  }else{
    btn.classList.add("wrong");
    document.getElementById("result").innerText="❌ Sai: " + current[1];
    sound(false);
    wrongList.push(current);

    // tăng tần suất xuất hiện lại
    data.push(current);
    data.push(current);
  }

  document.getElementById("score").innerText = score + "/" + count;

  setTimeout(next, 800);
}

// ===== END =====
function endGame(){
  show("end");
  document.getElementById("final").innerText = "Kết quả: " + score + "/30";
}

// ===== RETRY =====
function retryWrong(){
  if(wrongList.length===0){
    alert("Không có câu sai");
    return;
  }
  data=[...wrongList];
  score=0;
  count=0;
  wrongList=[];
  show("quiz");
  next();
}

// ===== BACK =====
function backMenu(){
  show("menu");
}

</script>

</body>
</html>
