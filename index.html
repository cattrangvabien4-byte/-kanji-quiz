<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Quiz</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 20px;
    max-width: 420px;
    margin: auto;
}

h2 {
    font-size: 22px;
}

.kanji {
    font-size: 90px; /* TO hơn */
    margin: 20px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    font-size: 18px; /* chữ to hơn */
    border-radius: 10px;
    border: none;
    background: #f1f5f9; /* sáng hơn */
    color: black;
}

button:active {
    opacity: 0.8;
}

.correct { background: #22c55e !important; color: white; }
.wrong { background: #ef4444 !important; color: white; }

#result {
    font-size: 18px;
    margin: 10px;
}

.score {
    margin-top: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="card">
    <h2>Kanji Radical Quiz</h2>
    <div class="kanji" id="q"></div>
    <div id="answers"></div>
    <p id="result"></p>

    <div class="score">
        Điểm: <span id="score">0</span> | 
        Câu: <span id="total">0</span>
    </div>

    <button onclick="next()">Câu tiếp</button>
</div>

<script>
const data = [
["人","người"],["女","phụ nữ"],["子","trẻ con"],["心","tim"],
["手","tay"],["目","mắt"],["口","miệng"],["耳","tai"],
["足","chân"],["水","nước"],["火","lửa"],["木","cây"],
["金","tiền"],["土","đất"],["日","mặt trời"],["月","mặt trăng"],
["言","nói"],["食","ăn"],["車","xe"],["門","cửa"],
["力","sức"],["又","tay / lại"],["生","sống"],["田","ruộng"]
];

let current, score=0, total=0;

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function next(){
    document.getElementById("result").innerText="";
    current = data[Math.floor(Math.random()*data.length)];
    document.getElementById("q").innerText = current[0];

    let opts=[current[1]];
    while(opts.length<4){
        let r = data[Math.floor(Math.random()*data.length)][1];
        if(!opts.includes(r)) opts.push(r);
    }

    opts = shuffle(opts);

    let html="";
    opts.forEach(o=>{
        html+=`<button onclick="check(this,'${o}')">${o}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
}

function check(btn, ans){
    total++;
    if(ans===current[1]){
        score++;
        btn.classList.add("correct");
        document.getElementById("result").innerText="✅ Đúng";
    } else {
        btn.classList.add("wrong");
        document.getElementById("result").innerText="❌ Sai: "+current[1];
    }

    document.getElementById("score").innerText = score;
    document.getElementById("total").innerText = total;
}

next();
</script>

</body>
</html>
