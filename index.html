<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Pro App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.card{
  max-width:420px;
  margin:40px auto;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
}

h1{margin-bottom:20px}

.kanji{
  font-size:90px;
  margin:20px 0;
}

button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  font-size:18px;
}

.btn{background:#e5e7eb;color:#1e293b}
.correct{background:#22c55e;color:white}
.wrong{background:#ef4444;color:white}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-size:18px;
}

.small{opacity:0.7;margin-top:10px}
</style>
</head>

<body>

<div class="card" id="menu">
<h1>Kanji Pro</h1>

<button class="btn" onclick="start(1)">Level 1 - Kanji → Nghĩa</button>
<button class="btn" onclick="start(2)">Level 2 - Nghĩa → Kanji</button>
<button class="btn" onclick="start(3)">Level 3 - Gõ nghĩa</button>
<button class="btn" onclick="start(4)">Level 4 - Gõ Kanji</button>

<p class="small" id="best"></p>
</div>

<div class="card" id="quiz" style="display:none">
<h2 id="title">Quiz</h2>
<div class="kanji" id="kanji"></div>

<div id="answers"></div>

<p id="result"></p>
<p id="score">0/0</p>

<button class="btn" onclick="back()">🏠 Menu</button>
</div>

<script>

// ===== DATA (50 bộ thủ) =====
let baseData = [
["人","người"],["女","phụ nữ"],["子","trẻ con"],["心","tim"],
["手","tay"],["目","mắt"],["口","miệng"],["耳","tai"],
["足","chân"],["水","nước"],["火","lửa"],["木","cây"],
["金","tiền"],["土","đất"],["日","mặt trời"],["月","mặt trăng"],
["言","nói"],["食","ăn"],["車","xe"],["門","cửa"],
["力","sức"],["又","lại"],["生","sống"],["田","ruộng"],
["雨","mưa"],["山","núi"],["川","sông"],["石","đá"],
["花","hoa"],["虫","côn trùng"],["犬","chó"],["魚","cá"],
["鳥","chim"],["米","gạo"],["竹","tre"],["糸","sợi"],
["貝","sò"],["王","vua"],["玉","ngọc"],["気","khí"],
["学","học"],["校","trường"],["先","trước"],["年","năm"],
["時","giờ"],["上","trên"],["下","dưới"],["中","giữa"]
];

let data = [...baseData];

// ===== STATE =====
let mode = 1;
let score = 0;
let count = 0;
let current;
let wrong = [];
let last = null;

// ===== START =====
function start(lv){
  mode = lv;
  score = 0;
  count = 0;
  wrong = [];
  data = [...baseData];

  show("quiz");
  next();
}

// ===== NEXT =====
function next(){
  if(count >= 30){
    end();
    return;
  }

  let item;
  do{
    item = data[Math.floor(Math.random()*data.length)];
  }while(item === last);

  last = item;
  current = item;

  document.getElementById("result").innerText="";
  document.getElementById("score").innerText=score+"/"+count;
  document.getElementById("answers").innerHTML="";

  if(mode==1) renderMCQ(current[0],current[1],true);
  if(mode==2) renderMCQ(current[1],current[0],false);
  if(mode==3) renderInput(current[0],current[1]);
  if(mode==4) renderInput(current[1],current[0]);
}

// ===== MCQ =====
function renderMCQ(q,correct,isKanji){
  document.getElementById("kanji").innerText=q;

  let arr=[correct];
  while(arr.length<4){
    let r=data[Math.floor(Math.random()*data.length)][isKanji?1:0];
    if(!arr.includes(r)) arr.push(r);
  }

  arr.sort(()=>Math.random()-0.5);

  let html="";
  arr.forEach(a=>{
    html+=`<button class="btn" onclick="checkMCQ(this,'${a}')">${a}</button>`;
  });

  document.getElementById("answers").innerHTML=html;
}

// ===== INPUT =====
function renderInput(q){
  document.getElementById("kanji").innerText=q;

  document.getElementById("answers").innerHTML=`
    <input id="input" placeholder="Nhập đáp án">
    <button class="btn" onclick="checkInput()">OK</button>
  `;
}

// ===== CHECK MCQ =====
function checkMCQ(btn,ans){
  count++;

  let correct = current[mode==1?1:0];

  if(ans==correct){
    score++;
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");
    wrong.push(current);
    data.push(current); // tăng tần suất lặp lại
  }

  save();

  setTimeout(next,600);
}

// ===== CHECK INPUT =====
function normalize(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function checkInput(){
  let val=document.getElementById("input").value.trim();
  count++;

  let correct=current[mode==3?1:0];
  let ok = mode==3 ? normalize(val)==normalize(correct) : val==correct;

  if(ok){
    score++;
    document.getElementById("result").innerText="✅ Đúng";
  }else{
    document.getElementById("result").innerText="❌ "+correct;
    wrong.push(current);
    data.push(current);
  }

  save();

  setTimeout(next,800);
}

// ===== END =====
function end(){
  document.getElementById("kanji").innerText="🎉 Kết thúc";
  document.getElementById("answers").innerHTML=`
    <p>Điểm: ${score}/30</p>
    <button class="btn" onclick="retry()">🔁 Học lại sai</button>
    <button class="btn" onclick="back()">🏠 Menu</button>
  `;
}

// ===== RETRY =====
function retry(){
  if(wrong.length==0){
    alert("Không có câu sai");
    return;
  }

  data=[...wrong];
  score=0;
  count=0;
  wrong=[];
  next();
}

// ===== MENU =====
function back(){
  show("menu");
  load();
}

function show(id){
  document.getElementById("menu").style.display="none";
  document.getElementById("quiz").style.display="none";
  document.getElementById(id).style.display="block";
}

// ===== SAVE =====
function save(){
  localStorage.setItem("best",Math.max(score,Number(localStorage.getItem("best")||0)));
}

function load(){
  document.getElementById("best").innerText="🏆 Best: "+(localStorage.getItem("best")||0);
}

load();

</script>

</body>
</html>
